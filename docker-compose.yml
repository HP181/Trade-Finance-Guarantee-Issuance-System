version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade_finance_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - trade_finance_network
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: trade_finance_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    networks:
      - trade_finance_network
    depends_on:
      - app

  db:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    container_name: trade_finance_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trade_finance_guarantee_issuance_system_production
      MYSQL_ROOT_PASSWORD: secure_root_password
      MYSQL_PASSWORD: secure_user_password
      MYSQL_USER: trade_finance_user
      SERVICE_NAME: mysql
    volumes:
      - tradedb:/var/lib/mysql
    networks:
      - trade_finance_network

networks:
  trade_finance_network:
    driver: bridge

volumes:
  tradedb:
    driver: local